name: ollama_app
description: "A modern and easy-to-use client for Ollama"
publish_to: 'none'
version: 1.2.0+9

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: 3.44.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  ollama_dart: ^2.2.0
  intl: any
  image: ^4.9.1
  mime: ^2.0.0
  get_time_ago: ^2.4.1
  shared_preferences: ^2.5.5
  flutter_chat_ui: ^1.6.13
  scroll_to_index: ^3.0.1
  uuid: ^4.4.0
  image_picker: ^1.1.1
  visibility_detector: ^0.4.0+2
  http: ^1.2.1
  dartx: ^1.2.0
  smooth_page_indicator: ^1.1.0
  transparent_image: ^2.0.1
  simple_icons: ^14.6.1
  url_launcher: ^6.2.6
  file_picker: ^8.0.3
  file_selector: ^1.0.3
  bitsdojo_window: ^0.1.6
  flutter_install_referrer: ^2.1.1
  package_info_plus: ^9.0.1
  version: ^3.0.2
  flutter_displaymode: ^0.6.0
  duration_picker: ^1.2.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  permission_handler: ^11.3.1
  datetime_loop: ^1.2.0
  universal_html: ^2.2.4
  pwa_install: ^0.0.5
  flutter_chat_types: any
  markdown: ^7.3.0
  flutter_math_fork: ^0.7.4
  flutter_highlight:
    git:
      url: https://github.com/JHubi1/highlight.dart
      path: flutter_highlight
  ogp_data_extract: ^0.2.2
  auto_route: ^11.1.0
  
  # dynamic_color: ^1.7.0
  dynamic_system_colors: ^1.9.0

  drift: ^2.33.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5

  # dynamic_color: any
  flutter_markdown: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.33.0
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo512.png
    - assets/logo512error.png
    - assets/welcome/1.png
    - assets/welcome/2.png
    - assets/welcome/3.png
    - assets/welcome/1dark.png
    - assets/welcome/2dark.png
    - assets/welcome/3dark.png
  fonts:
    - family: GoogleSansCode
      fonts:
        - asset: assets/fonts/GoogleSansCode-VariableFont_MONO,wght.ttf
        - asset: assets/fonts/GoogleSansCode-Italic-VariableFont_MONO,wght.ttf
          style: italic
